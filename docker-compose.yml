services:
  postgres:
    image: postgres:17-alpine
    container_name: eleganza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eleganza
      POSTGRES_USER: eleganza
      POSTGRES_PASSWORD: eleganza
    ports:
      - "5432:5432"
    volumes:
      - eleganza-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eleganza -d eleganza"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eleganza-postgres-data:
